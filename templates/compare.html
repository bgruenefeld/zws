<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Gemerkte Hunde vergleichen</title>
    <style>
      {% include "_nav_css.html" %}
      {% include "_pedigree_notes_css.html" %}
      * { box-sizing: border-box; }

      body {
        background: #f5f5f5;
        color: #333;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        margin: 0;
      }

      .container {
        margin: 0 auto;
        max-width: 1760px;
        padding: 30px 20px;
      }

      .page-header {
        align-items: flex-start;
        display: flex;
        gap: 16px;
        justify-content: space-between;
        margin-bottom: 20px;
      }

      .page-header h1 {
        color: #1f2937;
        font-size: 24px;
        font-weight: 700;
        margin: 0 0 4px;
      }

      .page-header p {
        color: #667085;
        font-size: 13px;
        margin: 0;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        justify-content: flex-end;
      }

      .button {
        align-items: center;
        background: #fff;
        border: 1px solid #cfd8e3;
        border-radius: 6px;
        color: #1f3a52;
        cursor: pointer;
        display: inline-flex;
        font-family: inherit;
        font-size: 13px;
        font-weight: 750;
        justify-content: center;
        padding: 8px 12px;
        text-decoration: none;
      }

      .button:hover {
        background: #f5f8fb;
        border-color: #9fb2c6;
      }

      .button.danger {
        border-color: #f2c7c7;
        color: #a32020;
      }

      .button.danger:hover {
        background: #fff5f5;
      }

      .empty-state {
        background: #fff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
        color: #52606d;
        display: none;
        padding: 32px;
      }

      .empty-state.active {
        display: block;
      }

      .empty-state h2 {
        color: #1f3a52;
        font-size: 18px;
        margin: 0 0 8px;
      }

      .empty-state p {
        font-size: 14px;
        line-height: 1.5;
        margin: 0 0 18px;
      }

      .compare-shell {
        background: #fff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
        display: none;
        overflow: auto;
      }

      .compare-shell.active {
        display: block;
      }

      .compare-table {
        border-collapse: collapse;
        font-size: 13px;
        min-width: 980px;
        width: 100%;
      }

      .compare-table th,
      .compare-table td {
        border-bottom: 1px solid #edf1f5;
        border-right: 1px solid #edf1f5;
        padding: 10px 12px;
        text-align: left;
        vertical-align: top;
      }

      .compare-table th:first-child,
      .compare-table td:first-child {
        background: #f8fafc;
        color: #52606d;
        font-weight: 800;
        left: 0;
        min-width: 190px;
        position: sticky;
        z-index: 1;
      }

      .compare-table th {
        background: #fbfcfe;
        color: #1f3a52;
        min-width: 240px;
      }

      .dog-head {
        background: transparent;
        border: 0;
        color: inherit;
        cursor: pointer;
        display: grid;
        gap: 8px;
        padding: 0;
        text-align: left;
        width: 100%;
      }

      .dog-head:hover .dog-name {
        color: #2563eb;
      }

      .dog-name {
        color: #1f3a52;
        font-size: 15px;
        font-weight: 850;
        line-height: 1.3;
      }

      .dog-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }

      .pedigree-detail {
        background: #fff;
        border: 1px solid #dbe2ea;
        border-radius: 8px;
        display: none;
        margin-top: 20px;
        overflow: hidden;
      }

      .pedigree-detail.active {
        display: block;
      }

      .pedigree-detail-header {
        align-items: center;
        border-bottom: 1px solid #edf1f5;
        display: flex;
        gap: 12px;
        justify-content: space-between;
        padding: 14px 16px;
      }

      .pedigree-detail-header h2 {
        color: #1f3a52;
        font-size: 16px;
        margin: 0;
      }

      .pedigree-detail-header p {
        color: #667085;
        font-size: 12px;
        margin: 4px 0 0;
      }

      .pedigree-area {
        background: #fff;
        min-height: 260px;
        overflow: auto;
      }

      .loading,
      .pedigree-error {
        color: #667085;
        font-size: 14px;
        padding: 24px;
      }

      .pedigree-error {
        color: #a32020;
      }

      .note-field {
        border: 1px solid #d5dde5;
        border-radius: 6px;
        color: #334158;
        font-family: inherit;
        font-size: 12px;
        line-height: 1.45;
        min-height: 72px;
        padding: 8px;
        resize: vertical;
        width: 100%;
      }

      .note-field:focus {
        border-color: #4a90e2;
        box-shadow: 0 0 0 3px rgba(74, 144, 226, 0.1);
        outline: none;
      }

      .muted {
        color: #98a2b3;
      }

      @media (max-width: 760px) {
        .container {
          padding: 20px 12px;
        }

        .page-header {
          display: grid;
        }

        .actions {
          justify-content: flex-start;
        }
      }
    </style>
  </head>
  <body>
    {% include "_nav.html" %}

    <main class="container">
      <div class="page-header">
        <div>
          <h1>Gemerkte Hunde vergleichen</h1>
          <p>Vergleiche die Hunde aus deiner Merkliste nebeneinander.</p>
        </div>
        <div class="actions">
          <a class="button" href="/search">Zur Hundesuche</a>
          <button type="button" id="clearWatchlist" class="button danger">Merkliste leeren</button>
        </div>
      </div>

      <section id="emptyState" class="empty-state">
        <h2>Keine Hunde auf der Merkliste</h2>
        <p>Es sind noch keine Hunde auf der Merkliste. Bitte füge auf der Hundesuche zunächst Hunde zur Merkliste hinzu.</p>
        <a class="button" href="/search">Zur Hundesuche</a>
      </section>

      <section id="compareShell" class="compare-shell" aria-live="polite">
        <table class="compare-table" id="compareTable"></table>
      </section>

      <section id="pedigreeDetail" class="pedigree-detail" aria-live="polite">
        <div class="pedigree-detail-header">
          <div>
            <h2 id="pedigreeTitle">Ahnentafel</h2>
            <p id="pedigreeMeta"></p>
          </div>
          <button type="button" class="button" onclick="closePedigreeDetail()">Ausblenden</button>
        </div>
        <div id="pedigreeArea" class="pedigree-area"></div>
      </section>
    </main>

    <script>
      const WATCHLIST_STORAGE_KEY = 'zwsDogWatchlist';
      const WATCHLIST_API_URL = '/api/watchlist';
      let watchlistSyncTimer = null;
      let selectedPedigreeZbnr = null;

      function readWatchlist() {
        try {
          const raw = localStorage.getItem(WATCHLIST_STORAGE_KEY);
          const parsed = raw ? JSON.parse(raw) : [];
          return Array.isArray(parsed) ? parsed.filter(dog => dog && dog.zbnr) : [];
        } catch (error) {
          console.warn('Merkliste konnte nicht gelesen werden:', error);
          return [];
        }
      }

      function writeWatchlist(dogs) {
        localStorage.setItem(WATCHLIST_STORAGE_KEY, JSON.stringify(dogs));
        window.dispatchEvent(new CustomEvent('watchlist:changed'));
        window.updateNavWatchlistCount?.();
        syncWatchlistToServer(dogs);
      }

      function mergeWatchlists(serverDogs, localDogs) {
        const byZbnr = new Map();
        (serverDogs || []).forEach(dog => {
          if (dog?.zbnr) byZbnr.set(String(dog.zbnr), dog);
        });
        (localDogs || []).forEach(dog => {
          const zbnr = String(dog?.zbnr || '').trim();
          if (!zbnr) return;
          const existing = byZbnr.get(zbnr);
          const localTime = Date.parse(dog?.saved_at || dog?.savedAt || '') || 0;
          const serverTime = Date.parse(existing?.saved_at || existing?.savedAt || '') || 0;
          if (!existing || localTime >= serverTime) byZbnr.set(zbnr, dog);
        });
        return Array.from(byZbnr.values());
      }

      function syncWatchlistToServer(dogs) {
        window.clearTimeout(watchlistSyncTimer);
        watchlistSyncTimer = window.setTimeout(() => {
          fetch(WATCHLIST_API_URL, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ items: dogs || readWatchlist() }),
            keepalive: true
          }).catch(error => {
            console.warn('Merkliste konnte nicht in SQLite gespeichert werden:', error);
          });
        }, 120);
      }

      function loadWatchlistFromServer() {
        fetch(WATCHLIST_API_URL)
          .then(r => r.json().then(data => {
            if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
            return data;
          }))
          .then(data => {
            const merged = mergeWatchlists(data.items || [], readWatchlist());
            localStorage.setItem(WATCHLIST_STORAGE_KEY, JSON.stringify(merged));
            window.dispatchEvent(new CustomEvent('watchlist:changed'));
            window.updateNavWatchlistCount?.();
            renderComparePage();
            syncWatchlistToServer(merged);
          })
          .catch(error => {
            console.warn('Merkliste konnte nicht aus SQLite geladen werden:', error);
          });
      }

      function removeFromWatchlist(zbnr) {
        const key = String(zbnr || '').trim();
        writeWatchlist(readWatchlist().filter(dog => dog.zbnr !== key));
        if (selectedPedigreeZbnr === key) closePedigreeDetail();
        renderComparePage();
      }

      function clearWatchlist() {
        writeWatchlist([]);
        closePedigreeDetail();
        renderComparePage();
      }

      function saveWatchlistNote(zbnr, value) {
        const key = String(zbnr || '').trim();
        const dogs = readWatchlist();
        const index = dogs.findIndex(dog => dog.zbnr === key);
        if (index < 0) return;

        dogs[index] = { ...dogs[index], bemerkung: value };
        writeWatchlist(dogs);
      }

      function renderComparePage() {
        const dogs = readWatchlist();
        const emptyState = document.getElementById('emptyState');
        const compareShell = document.getElementById('compareShell');
        const compareTable = document.getElementById('compareTable');

        emptyState.classList.toggle('active', dogs.length === 0);
        compareShell.classList.toggle('active', dogs.length > 0);

        if (dogs.length === 0) {
          compareTable.innerHTML = '';
          return;
        }

        ensurePedigreeMetrics(dogs);

        const rows = [
          ['Name', dog => textCell(dog.name || 'unbekannt')],
          ['Zuchtbuchnummer', dog => textCell(dog.zbnr || '—')],
          ['Geschlecht', dog => textCell(dog.geschlecht || '—')],
          ['Geburtsdatum / Jahr', dog => textCell(dog.wurfdatum || dog.birth_year || '—')],
          ['ED-Befund', dog => textCell(dog.ed || '—')],
          ['ED-Zuchtwert / ED-EBV', dog => textCell(dog.zuchtwert ?? '—')],
          ['Sicherheit / Konfidenz', dog => textCell(dog.konfidenz != null ? dog.konfidenz + ' %' : '—')],
          ['HD-Befund', dog => textCell(dog.hd || '—')],
          ['Anzahl Nachkommen', dog => textCell(dog.anz_nachkommen ?? '—')],
          ['Gentests', formatGeneticTests],
          ['Zahnstatus', dog => textCell(dog.zs || '—')],
          ['COI / AVK', formatPedigreeMetrics],
          ['Bemerkung', renderNoteField]
        ];

        compareTable.innerHTML = `
          <thead>
            <tr>
              <th>Kriterium</th>
              ${dogs.map(dog => `
                <th>
                  <button type="button" class="dog-head" onclick="loadPedigreeDetail('${escapeJs(dog.zbnr)}')">
                    <div class="dog-name">${escapeHtml(dog.name || 'unbekannt')}</div>
                    <div class="muted">${escapeHtml(dog.zbnr || '—')}</div>
                  </button>
                    <div class="dog-actions">
                      <a class="button" href="/search?q=${encodeURIComponent(dog.zbnr)}">Details öffnen</a>
                      <button type="button" class="button danger" onclick="removeFromWatchlist('${escapeJs(dog.zbnr)}')">Entfernen</button>
                    </div>
                </th>
              `).join('')}
            </tr>
          </thead>
          <tbody>
            ${rows.map(([label, getter]) => `
              <tr>
                <td>${escapeHtml(label)}</td>
                ${dogs.map(dog => `<td>${getter(dog)}</td>`).join('')}
              </tr>
            `).join('')}
          </tbody>
        `;
      }

      function ensurePedigreeMetrics(dogs) {
        dogs
          .filter(dog => dog.zbnr && missingPedigreeMetrics(dog))
          .forEach(dog => fetchPedigreeMetrics(dog.zbnr));
      }

      function missingPedigreeMetrics(dog) {
        return (
          dog.coi_percent === undefined ||
          dog.avk_known_percent === undefined ||
          dog.complete_generation === undefined
        );
      }

      function fetchPedigreeMetrics(zbnr) {
        fetch('/pedigree_metrics?zbnr=' + encodeURIComponent(zbnr) + '&gens=5')
          .then(r => {
            return r.json().then(data => {
              if (!r.ok) throw new Error(data.error || ('HTTP ' + r.status));
              return data;
            });
          })
          .then(data => {
            const dogs = readWatchlist();
            const index = dogs.findIndex(dog => dog.zbnr === zbnr);
            if (index < 0) return;

            dogs[index] = {
              ...dogs[index],
              coi_percent: data.coi_percent ?? null,
              avk_known_percent: data.avk_known_percent ?? null,
              complete_generation: data.deepest_complete_generation_in_data ?? null
            };
            writeWatchlist(dogs);
            renderComparePage();
          })
          .catch(error => {
            console.warn('Pedigree-Kennzahlen konnten nicht geladen werden:', error);
          });
      }

      function formatGeneticTests(dog) {
        const values = [
          ['prcd-PRA', dog.prcd_pra],
          ['HNPK', dog.hnpk],
          ['SD2', dog.sd2],
          ['CNM', dog.cnm],
          ['EIC', dog.eic],
          ['STGD', dog.stgd_status]
        ].filter(([, value]) => value && value !== '—');

        if (values.length === 0) return '<span class="muted">—</span>';
        return escapeHtml(values.map(([label, value]) => `${label} ${value}`).join(' · '));
      }

      function textCell(value) {
        return escapeHtml(value);
      }

      function formatPedigreeMetrics(dog) {
        if (missingPedigreeMetrics(dog)) return '<span class="muted">wird geladen...</span>';

        const coi = formatPercent(dog.coi_percent);
        const avk = formatPercent(dog.avk_known_percent);
        const complete = dog.complete_generation != null ? 'vollständig bis Gen. ' + dog.complete_generation : '';
        const parts = [`COI ${coi}`, `AVK ${avk}`, complete].filter(Boolean);
        return escapeHtml(parts.join(' · '));
      }

      function renderNoteField(dog) {
        return `
          <textarea
            class="note-field"
            placeholder="Bemerkung zu diesem Hund"
            oninput="saveWatchlistNote('${escapeJs(dog.zbnr)}', this.value)"
          >${escapeHtml(dog.bemerkung || '')}</textarea>
        `;
      }

      function loadPedigreeDetail(zbnr) {
        const dog = readWatchlist().find(item => item.zbnr === zbnr) || {};
        const detail = document.getElementById('pedigreeDetail');
        const title = document.getElementById('pedigreeTitle');
        const meta = document.getElementById('pedigreeMeta');
        const area = document.getElementById('pedigreeArea');

        if (!zbnr || !detail || !title || !meta || !area) return;

        selectedPedigreeZbnr = zbnr;
        detail.classList.add('active');
        title.textContent = 'Ahnentafel für ' + (dog.name || zbnr);
        meta.textContent = 'ZBNr ' + (dog.zbnr || zbnr);
        area.innerHTML = '<div class="loading">Ahnentafel wird geladen...</div>';
        detail.scrollIntoView({ behavior: 'smooth', block: 'start' });

        fetch('/pedigree_fragment?zbnr=' + encodeURIComponent(zbnr) + '&gens=5')
          .then(r => {
            return r.text().then(html => {
              if (!r.ok) throw new Error(html || ('HTTP ' + r.status));
              return html;
            });
          })
          .then(html => {
            area.innerHTML = html;
          })
          .catch(error => {
            area.innerHTML = '<div class="pedigree-error">Fehler beim Laden der Ahnentafel: ' + escapeHtml(error.message) + '</div>';
          });
      }

      function closePedigreeDetail() {
        const detail = document.getElementById('pedigreeDetail');
        const area = document.getElementById('pedigreeArea');
        selectedPedigreeZbnr = null;
        if (detail) detail.classList.remove('active');
        if (area) area.innerHTML = '';
      }

      function formatPercent(value) {
        if (value === null || value === undefined || Number.isNaN(Number(value))) return '—';
        return Number(value).toLocaleString('de-DE', {
          minimumFractionDigits: 2,
          maximumFractionDigits: 2
        }) + ' %';
      }

      function escapeHtml(value) {
        return String(value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      function escapeJs(value) {
        return String(value || '').replace(/\\/g, '\\\\').replace(/'/g, "\\'");
      }

      {% include "_pedigree_notes_script.html" %}

      document.getElementById('clearWatchlist')?.addEventListener('click', clearWatchlist);
      renderComparePage();
      loadWatchlistFromServer();
    </script>
  </body>
</html>
