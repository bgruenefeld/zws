<nav class="app-nav" aria-label="Hauptnavigation">
  <div class="app-nav__inner">
    <a class="app-nav__brand" href="/" aria-label="CRD Startseite">
      <img src="{{ url_for('static', filename='planer-logo.png') }}" alt="CRD – Canine Relationship & Diversity">
    </a>
    <div class="app-nav__links">
      <a href="/search">Hundesuche</a>
      <a class="app-nav__watchlist" href="/compare" aria-label="Merkzettel öffnen">
        Merkzettel <span class="app-nav__badge" id="navWatchlistCount">0</span>
      </a>
      <a href="/pairing">Verpaarungen planen</a>
      <a href="/user-dogs">Eigene Hunde</a>
      <details class="app-nav__menu">
        <summary>Infos</summary>
        <div class="app-nav__submenu">
          <a href="/grundsaetze-zuchtplanung">Grundsätze der Zuchtplanung</a>
          <a href="/info">Informationen zur Zuchtwertschätzung</a>
        </div>
      </details>
      {% set nav_username = session.get("username", "") %}
      {% if nav_username %}
        <span class="app-nav__user" title="Angemeldet als {{ nav_username }}" aria-label="Angemeldet als {{ nav_username }}">
          {{ nav_username[:1] | upper }}
        </span>
      {% endif %}
      <form class="app-nav__logout" method="post" action="/logout">
        <button type="submit">Abmelden</button>
      </form>
    </div>
  </div>
</nav>
<script>
  (function () {
    const storageKey = 'zwsDogWatchlist';

    function readNavWatchlistCount() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey) || '[]');
        return Array.isArray(parsed) ? parsed.filter(dog => dog && dog.zbnr).length : 0;
      } catch {
        return 0;
      }
    }

    window.updateNavWatchlistCount = function updateNavWatchlistCount() {
      const badge = document.getElementById('navWatchlistCount');
      if (!badge) return;
      badge.textContent = String(readNavWatchlistCount());
    };

    function updateNavWatchlistCountFromServer() {
      fetch('/api/watchlist')
        .then(r => r.json())
        .then(data => {
          if (!Array.isArray(data.items)) return;
          const localCount = readNavWatchlistCount();
          const serverCount = data.items.filter(dog => dog && dog.zbnr).length;
          const badge = document.getElementById('navWatchlistCount');
          if (badge && serverCount > localCount) badge.textContent = String(serverCount);
        })
        .catch(() => {});
    }

    window.updateNavWatchlistCount();
    updateNavWatchlistCountFromServer();
    window.addEventListener('storage', event => {
      if (event.key === storageKey) window.updateNavWatchlistCount();
    });
    window.addEventListener('watchlist:changed', window.updateNavWatchlistCount);
  })();
</script>
